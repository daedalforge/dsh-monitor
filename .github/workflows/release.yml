name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Tag to publish again, for example v0.1.0
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'Release v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || 'main' }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - uses: actions/create-github-app-token@v3
        id: app
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Use the latest npm
        run: npm install --global npm@latest

      - name: Test
        run: npm test

      - name: Pick the next version
        id: version
        env:
          REQUESTED: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED:-}" ]; then
            echo "version=${REQUESTED#v}" >> "$GITHUB_OUTPUT"
            echo "republishing ${REQUESTED#v}"
            exit 0
          fi
          last="$(git tag --list 'v*' --sort=-v:refname | head -1)"
          if [ -z "$last" ]; then
            version="$(node -p "require('./package.json').version")"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "no tag yet, first release is $version"
            exit 0
          fi
          messages="$(git log --format='%s%n%b' "$last..HEAD")"
          if grep -qE '^[a-z]+(\(.+\))?!:|BREAKING[ -]CHANGE' <<< "$messages"; then
            bump=major
          elif grep -qE '^feat(\(.+\))?:' <<< "$messages"; then
            bump=minor
          else
            bump=patch
          fi
          base="${last#v}"
          IFS=. read -r x y z <<< "$base"
          case "$bump" in
            major) x=$((x + 1)); y=0; z=0 ;;
            minor) y=$((y + 1)); z=0 ;;
            patch) z=$((z + 1)) ;;
          esac
          echo "version=$x.$y.$z" >> "$GITHUB_OUTPUT"
          echo "$last plus a $bump change releases $x.$y.$z"

      - name: Set the version
        if: github.event_name != 'workflow_dispatch'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          current="$(node -p "require('./package.json').version")"
          if [ "$current" = "$VERSION" ]; then
            echo "package.json already says $VERSION"
            exit 0
          fi
          npm version "$VERSION" --no-git-tag-version

      - name: Commit the version on main
        id: commit
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if git diff --quiet package.json; then
            echo "package.json is already at $VERSION"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          content="$(base64 < package.json | tr -d '\n')"
          sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/package.json" --jq .sha)"
          commit="$(gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/package.json" \
            -f message="Release v$VERSION" \
            -f content="$content" \
            -f sha="$sha" \
            -f branch=main \
            --jq .commit.sha)"
          echo "sha=$commit" >> "$GITHUB_OUTPUT"
          echo "Release v$VERSION committed as $commit"

      - name: Tag the release
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION is already tagged"
            exit 0
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/v$VERSION" \
            -f sha="$SHA" >/dev/null
          echo "tagged v$VERSION"

      - name: Publish to npm with trusted publishing
        run: npm publish --access public --provenance

      - name: Pack the tarball
        run: npm pack --pack-destination dist

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v$VERSION" dist/*.tgz --title "v$VERSION" --generate-notes
