name: Release

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      version:
        description: Tag to publish again, for example v0.1.0
        required: true

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || 'main' }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Use the latest npm
        run: npm install --global npm@latest

      - name: Pick the next version
        id: version
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          REQUESTED: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED:-}" ]; then
            echo "version=${REQUESTED#v}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tags="$(git tag --list 'v*' --sort=-v:refname)"
          last="${tags%%$'\n'*}"
          if [ -z "$last" ]; then
            current="$(node -p "require('./package.json').version")"
            echo "version=$current" >> "$GITHUB_OUTPUT"
            echo "no tag yet, first release is $current"
            exit 0
          fi
          base="${last#v}"
          IFS=. read -r x y z <<< "$base"
          case "$BRANCH" in
            fix/*) z=$((z + 1)) ;;
            major/*) x=$((x + 1)); y=0; z=0 ;;
            *) y=$((y + 1)); z=0 ;;
          esac
          echo "version=$x.$y.$z" >> "$GITHUB_OUTPUT"
          echo "$last on $BRANCH releases $x.$y.$z"

      - name: Test
        run: npm test

      - name: Commit the version on main
        id: commit
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          current="$(node -p "require('./package.json').version")"
          if [ "$current" = "$VERSION" ]; then
            echo "package.json already says $VERSION"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm version "$VERSION" --no-git-tag-version
          content="$(base64 < package.json | tr -d '\n')"
          sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/package.json" --jq .sha)"
          commit="$(gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/package.json"             -f message="Release v$VERSION"             -f content="$content"             -f sha="$sha"             -f branch=main             --jq .commit.sha)"
          echo "sha=$commit" >> "$GITHUB_OUTPUT"
          echo "Release v$VERSION committed as $commit"

      - name: Tag the release
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION is already tagged"
            exit 0
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/v$VERSION" \
            -f sha="$SHA" >/dev/null
          echo "tagged v$VERSION"

      - name: Publish to npm with trusted publishing
        run: npm publish --access public --provenance

      - name: Pack the tarball
        run: npm pack --pack-destination dist

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v$VERSION" dist/*.tgz --title "v$VERSION" --generate-notes
