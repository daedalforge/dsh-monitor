name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax
        run: |
          node --check lib/index.js
          node --check lib/client.js
      - name: Tests
        run: npm test
      - name: No local path
        run: |
          if git grep -nE '/(Users|home)/[A-Za-z]' -- lib cordis.patch.yml README.md package.json LICENSE; then
            echo "::error::absolute local path found in a published file"
            exit 1
          fi
