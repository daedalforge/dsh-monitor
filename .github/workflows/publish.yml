name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish again, for example v0.1.1
        required: true

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Use the latest npm
        run: npm install --global npm@latest

      - name: Check the release and the package agree
        env:
          TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::release $TAG does not match package.json $version"
            exit 1
          fi
          echo "publishing $version"

      - name: Test
        run: npm test

      - name: Publish to npm with trusted publishing
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm, leaving it alone"
            exit 0
          fi
          if ! npm view "$name" version >/dev/null 2>&1; then
            echo "::error::$name does not exist on npm yet. Trusted publishing only publishes new versions of an existing package: publish the first one with npm login and npm publish, then configure the trusted publisher."
            exit 1
          fi
          npm publish --access public --provenance

      - name: Attach the tarball to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
        run: |
          set -euo pipefail
          npm pack --pack-destination dist
          gh release upload "$TAG" dist/*.tgz --clobber
